<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sekenov · pieces</title>
<meta name="description" content="small interface moments, designed and coded by hand">
<meta name="theme-color" content="#0d100f">
<meta property="og:title" content="sekenov · pieces">
<meta property="og:description" content="small interface moments, designed and coded by hand">
<meta property="og:image" content="https://sekenoov.github.io/og.jpg">
<meta property="og:url" content="https://sekenoov.github.io/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@sekenoov">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d100f'/%3E%3Crect x='6' y='15' width='20' height='2' rx='1' fill='%23ff5b34'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d100f; --panel:#141917; --ink:#e9e6d9; --mute:#8d9089; --faint:#5b5f5a;
  --line:rgba(233,230,217,.12); --accent:#ff5b34; --green:#3ccf6e;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.6,0,.8,.2);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ecebe4; --panel:#e2e0d7; --ink:#151817; --mute:#6d706a; --faint:#a3a59e;
  --line:rgba(21,24,23,.12); --accent:#ec4a22; --green:#22a956;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}

/* layout */
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);padding:0 28px}
.top{display:flex;align-items:center;gap:18px;height:68px}
.mark{font-weight:650;letter-spacing:-.02em;font-size:17px}
.role{color:var(--mute);font-size:14px}
.spacer{flex:1}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background-color .2s}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.chip:active{transform:scale(.97)}
.talk{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:550}
.talk:hover{border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);opacity:0;animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}70%,100%{transform:scale(1.5);opacity:0}}

/* equalizer on the sound chip */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:2px;height:3px;background:currentColor;border-radius:1px;transition:height .25s}
#sound .eq{display:none}
.sound-on .x{display:none}
.sound-on .eq{display:inline-flex}
.sound-on .eq i{animation:eq .9s ease-in-out infinite}
.sound-on .eq i:nth-child(2){animation-delay:-.3s}
.sound-on .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.main{display:grid;grid-template-columns:minmax(260px,400px) auto;justify-content:center;align-items:center;gap:clamp(32px,6vw,96px);min-height:0}

/* info column */
.info{display:flex;flex-direction:column;gap:18px;min-width:0}
.count{font-family:var(--mono);font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.odo{display:inline-flex;color:var(--ink)}
.odo .col{display:inline-block;height:1.25em;overflow:hidden;line-height:1.25em}
.odo .col span{display:block;transition:transform .55s var(--ease)}
.title{font-size:clamp(44px,5.6vw,84px);font-weight:650;letter-spacing:-.045em;line-height:.98;overflow:hidden;padding-bottom:.08em;white-space:nowrap}
.title .ch{display:inline-block;will-change:transform}
.desc{font-size:17px;line-height:1.45;color:var(--mute);max-width:34ch;min-height:2.9em}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--mono)}
.nav{display:flex;gap:8px;align-items:center;margin-top:6px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:border-color .2s,transform .15s}
.arrow:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.arrow:active{transform:scale(.92)}
.arrow svg{width:18px;height:18px}
.all{margin-left:6px}
.hint{font-size:12px;color:var(--faint);font-family:var(--mono);margin-left:auto}

/* stage */
.stage{position:relative;height:min(calc(100vh - 68px - 150px),860px,calc((100vw - 56px - 260px - clamp(32px,6vw,96px)) * 1.25));aspect-ratio:4/5;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:var(--panel);clip-path:inset(0 0 0 0 round 16px);will-change:clip-path}
.screen video,.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thread{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--accent);border-radius:2px;opacity:0;pointer-events:none;transform-origin:50% 50%}
.progress{position:absolute;left:16px;right:16px;bottom:-14px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{position:absolute;inset:0;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.paused-badge{position:absolute;top:14px;right:14px;font:12px var(--mono);padding:5px 9px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;opacity:0;transition:opacity .2s;pointer-events:none;backdrop-filter:blur(8px)}
.is-paused .paused-badge{opacity:1}

/* reel */
.reel-wrap{position:relative;padding:22px 0 22px}
.reel{display:flex;gap:6px;align-items:flex-end;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:28px 40px 4px;mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.reel::-webkit-scrollbar{display:none}
.thumb{flex:none;width:44px;height:55px;border-radius:7px;overflow:hidden;position:relative;opacity:.55;transition:opacity .25s;background:var(--panel)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb:hover,.thumb.on{opacity:1}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line)}
.thumb.on::after{box-shadow:inset 0 0 0 2px var(--accent)}
.thumb .lbl{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);font-size:11px;white-space:nowrap;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}

/* tooltip floats above reel */
.tip{position:fixed;font-size:12px;font-weight:550;padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);pointer-events:none;opacity:0;transform:translate(-50%,4px);transition:opacity .12s,transform .12s;white-space:nowrap;z-index:5}
.tip.show{opacity:1;transform:translate(-50%,0)}

.foot{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:11px var(--mono);color:var(--faint)}

/* index overlay */
.index{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:0 28px 60px;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
.index.open{visibility:visible;opacity:1;transition:opacity .2s}
.index-top{position:sticky;top:0;display:flex;align-items:center;gap:10px;height:68px;background:var(--bg);z-index:2;flex-wrap:wrap}
.index-top h2{font-size:17px;font-weight:650;letter-spacing:-.02em;margin-right:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);font-size:13px;color:var(--mute);transition:all .2s}
.filter.on{background:var(--ink);color:var(--bg);border-color:transparent}
.filter sup{font:10px var(--mono);margin-left:3px;opacity:.7;vertical-align:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 14px;margin-top:8px}
.card{text-align:left;display:flex;flex-direction:column;gap:8px}
.card .pic{aspect-ratio:4/5;border-radius:12px;overflow:hidden;position:relative;background:var(--panel)}
.card .pic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.card:hover .pic::after{box-shadow:inset 0 0 0 2px var(--accent)}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover img{transform:scale(1.03)}
.card b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card span{font-size:13px;color:var(--mute);line-height:1.35}
.card.hide{display:none}

/* contact popover */
.contact{position:fixed;z-index:20;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.35);visibility:hidden}
.contact.open{visibility:visible}
.contact p{font-size:13px;color:var(--mute);padding:10px 10px 12px;line-height:1.4}
.contact p b{color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:10px;font-size:14px;transition:background-color .15s}
.row:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.row .k{color:var(--mute);width:62px}
.row .v{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .go{font:12px var(--mono);color:var(--mute);height:1.25em;overflow:hidden;line-height:1.25em;text-align:right}
.row .go span{display:block;transition:transform .35s var(--ease)}
.row.done .go span{transform:translateY(-100%)}
.row.done .go{color:var(--green)}
.scrim{position:fixed;inset:0;z-index:15;display:none}
.scrim.on{display:block}

/* mobile */
@media (max-width:820px){
  body{overflow:auto}
  .app{display:block;padding:0 16px;height:auto}
  .top{height:60px;gap:10px}
  .role,.sound-lbl,.hint{display:none}
  .chip{padding:0 12px}
  .main{display:flex;flex-direction:column-reverse;gap:26px;padding-top:4px}
  .stage{height:auto;width:min(100%,calc((100svh - 260px)*.8));min-width:min(100%,300px)}
  .info{width:100%;gap:12px}
  .title{font-size:44px}
  .desc{font-size:16px;min-height:0}
  .reel-wrap{padding:14px 0 40px;margin:0 -16px}
  .reel{justify-content:flex-start;padding:28px 16px 4px;scroll-snap-type:x proximity;mask-image:none}
  .thumb{width:48px;height:60px;scroll-snap-align:center}
  .index{padding:0 16px 40px}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px 10px}
  .contact{left:16px!important;right:16px;width:auto;top:auto!important;bottom:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="mark" href="#" id="home">sekenov</a>
    <span class="role">product designer who codes</span>
    <span class="spacer"></span>
    <button class="chip" id="sound" aria-pressed="false" title="sound (m)" aria-label="sound"><svg class="spk" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 6h2.2L8 3.3v9.4L4.7 10H2.5z" fill="currentColor"/><path class="x" d="m11 6.2 3.4 3.6m0-3.6L11 9.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="eq"><i></i><i></i><i></i></span><span class="sound-lbl">sound</span></button>
    <button class="chip" id="theme" title="theme (t)" aria-label="switch theme">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
    </button>
    <button class="chip talk" id="talk"><i class="dot"></i>dms open</button>
  </header>

  <main class="main">
    <section class="info">
      <div class="count"><span class="odo" id="odo"></span><span>/ <span id="total"></span></span></div>
      <h1 class="title" id="title"></h1>
      <p class="desc" id="desc"></p>
      <div class="meta" id="meta"></div>
      <div class="nav">
        <button class="arrow" id="prev" aria-label="previous"><svg viewBox="0 0 18 18" fill="none"><path d="M11 3.5 5.5 9l5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="arrow" id="next" aria-label="next"><svg viewBox="0 0 18 18" fill="none"><path d="M7 3.5 12.5 9 7 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="chip all" id="openIndex">all <span id="allCount"></span></button>
        <span class="hint">← → to switch</span>
      </div>
    </section>

    <figure class="stage" id="stage">
      <div class="screen" id="screen">
        <video id="vid" muted playsinline autoplay loop preload="auto"></video>
      </div>
      <div class="thread" id="thread"></div>
      <div class="paused-badge">paused</div>
      <div class="progress"><i id="prog"></i></div>
    </figure>
  </main>

  <div class="reel-wrap">
    <nav class="reel" id="reel" aria-label="pieces"></nav>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div class="tip" id="tip"></div>

<section class="index" id="index" aria-label="all pieces">
  <div class="index-top">
    <h2>all pieces</h2>
    <div class="filters" id="filters"></div>
    <span class="spacer"></span>
    <button class="chip" id="closeIndex">close</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<div class="scrim" id="scrim"></div>
<div class="contact" id="contact" role="dialog" aria-label="contact">
  <p>open for <b>projects</b>: product design, interactions, motion in code. say hi anywhere</p>
  <div id="rows"></div>
</div>

<script>
// edit these
const ME = {
  x: 'sekenoov',           // x.com handle
  threads: 'sekenov.ai',   // threads handle
  email: 'sekenoov@gmail.com'
};

const P = [
  ['online','online','messages circle the green dot like moths around a porch light',['texting','work']],
  ['mute','good','a whole weekend story told on mute piles up in the call tile',['work']],
  ['watching','still watching','continue watching pulls the cursor away from back like a magnet',['tv']],
  ['brunch','thank god','friends cancel brunch one by one and drop out of the group header',['texting']],
  ['pick','you pick','lunch indecision as a ping-pong rally until the replies shrink to “u”',['texting']],
  ['anyway','anyway','do not disturb bounces the boss, then “quick question” breaks it',['work','phone']],
  ['hbd','hbd','every word you deleted piles up on the keyboard',['texting']],
  ['fold','fold','each “are you sure?” folds the answer like a note',['ai']],
  ['refresh','refresh','pull to refresh and “unfortunately,” drops in like every other email',['email']],
  ['nvm','nvm','a 7:48 voice note unrolls across the screen like tape',['texting']],
  ['hey','hey','a 2 am “hey” pulls the whole lock screen in',['texting','phone']],
  ['unsend','unsend','five rubber bands hold the sent message, your finger is late to undo',['texting']],
  ['source','source','the link in the answer is a 404 and the answer falls apart plank by plank',['ai']],
  ['typing','typing','the typing bubble inflates like a balloon on “are you mad at me?”',['texting']],
  ['monday','later','monday as a macos update you can’t postpone',['work']],
  ['sunday','charged','the phone charges all weekend, monday eats it by 9 am',['phone']],
  ['alarms','no alarms','swipe the alarms away, one of them never turns off',['phone']],
  ['shake','shake','shake the phone and the em dashes fall out of the answer',['ai','phone']],
  ['friday','weekend','at 5:00 pm a weekend block pushes the weekdays aside',['work']],
  ['brake','brake','stop a streaming answer and the words crash by inertia',['ai']],
  ['cooldown','cooldown','hold send and an angry email cools down into corporate',['email']],
  ['almost','almost','the answer spins like a slot reel between no and yes',['ai']],
  ['rabbit','rabbit hole','one word of the answer becomes the next question, forever',['ai']],
  ['develop','develop','an image develops out of noise, word by word of the prompt',['ai']],
  ['pinch','pinch','pinch an ai answer from 112 words down to 9',['ai']],
  ['compact','compact','the chat compresses and the facts fly into a summary',['ai']],
].map(([id,name,desc,tags])=>({id,name,desc,tags}));

const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const src = (p,kind) => `media/${p.id}-${theme()}${kind}`;

/* ---------- theme ---------- */
const sysDark = matchMedia('(prefers-color-scheme: dark)');
function theme(){ return document.documentElement.dataset.theme || (sysDark.matches ? 'dark' : 'light') }
function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#0d100f' : '#ecebe4';
}
setTheme(store.get('theme') || (sysDark.matches ? 'dark' : 'light'));

/* ---------- elements ---------- */
const vid = $('#vid'), screen = $('#screen'), thread = $('#thread'), stage = $('#stage');
const titleEl = $('#title'), descEl = $('#desc'), metaEl = $('#meta'), reel = $('#reel');
$('#total').textContent = String(P.length).padStart(2,'0');
$('#allCount').textContent = P.length;

/* ---------- odometer ---------- */
const odo = $('#odo');
const cols = [0,1].map(()=>{
  const c = document.createElement('span'); c.className='col';
  const inner = document.createElement('span');
  inner.innerHTML = [...'0123456789'].map(d=>`<span>${d}</span>`).join('');
  inner.style.display='block'; c.appendChild(inner); odo.appendChild(c); return inner;
});
function setOdo(n){
  const s = String(n).padStart(2,'0');
  // right to left, like a counter turning over
  [...s].forEach((d,i)=>{
    const inner = cols[i];
    inner.style.transition = `transform .55s var(--ease) ${(1-i)*70}ms`;
    inner.style.transform = `translateY(${-d*1.25}em)`;
  });
}

/* ---------- title roll ---------- */
function splitTitle(text){
  titleEl.innerHTML = '';
  return [...text].map(c=>{
    const s = document.createElement('span'); s.className='ch';
    s.textContent = c===' ' ? ' ' : c; titleEl.appendChild(s); return s;
  });
}
function rollTitle(text, dir){
  const old = [...titleEl.querySelectorAll('.ch')];
  const out = old.map((s,i)=>s.animate(
    [{transform:'translateY(0)'},{transform:`translateY(${-dir*105}%)`}],
    {duration:reduced?0:220,delay:reduced?0:i*14,easing:'cubic-bezier(.6,0,.8,.2)',fill:'forwards'}).finished);
  return Promise.all(out).then(()=>{
    const chars = splitTitle(text);
    chars.forEach((s,i)=>s.animate(
      [{transform:`translateY(${dir*105}%)`},{transform:'translateY(0)'}],
      {duration:reduced?0:520,delay:reduced?0:i*22,easing:'cubic-bezier(.2,1.25,.3,1)',fill:'backwards'}));
  });
}
function setInfo(p, dir){
  descEl.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateY(${-dir*6}px)`}],{duration:160,fill:'forwards'})
    .finished.then(()=>{
      descEl.textContent = p.desc;
      metaEl.innerHTML = p.tags.map(t=>`<span class="tag">${t}</span>`).join('') + `<span class="tag" id="loopTag">loop</span>`;
      descEl.animate([{opacity:0,transform:`translateY(${dir*6}px)`},{opacity:1,transform:'none'}],{duration:320,delay:120,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
      metaEl.animate([{opacity:0},{opacity:1}],{duration:300,delay:200,fill:'both'});
    });
}

/* ---------- reel ---------- */
const thumbs = P.map((p,i)=>{
  const b = document.createElement('button');
  b.className='thumb'; b.setAttribute('aria-label',p.name);
  b.innerHTML = `<img alt="" loading="lazy" decoding="async">`;
  b.onclick = ()=>go(i);
  b.onpointerenter = ()=>showTip(b,p.name);
  b.onpointerleave = hideTip;
  reel.appendChild(b); return b;
});
function paintThumbs(){ thumbs.forEach((b,i)=>b.querySelector('img').src = src(P[i],'-t.jpg')) }

const tip = $('#tip');
function showTip(el,text){
  if(!matchMedia('(pointer:fine)').matches) return;
  tip.textContent = text; tip.classList.add('show'); tip._el = el; placeTip();
}
function placeTip(){
  if(!tip._el) return;
  const r = tip._el.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2) + 'px';
  tip.style.top = (r.top - 30) + 'px';
}
function hideTip(){ tip.classList.remove('show'); tip._el = null }

// dock: thumbs near the cursor grow, the rest make room
let dockX = null; const dockW = thumbs.map(()=>44);
reel.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') dockX = e.clientX });
reel.addEventListener('pointerleave',()=>{ dockX = null });
function dock(){
  if(matchMedia('(max-width:820px)').matches) return;
  thumbs.forEach((b,i)=>{
    let target = 44;
    if(dockX!==null){
      const r = b.getBoundingClientRect();
      const d = (r.left + r.width/2 - dockX) / 64;
      target = 44 * (1 + .85*Math.exp(-d*d));
    }
    dockW[i] += (target - dockW[i]) * .22;
    if(Math.abs(target-dockW[i])<.05) dockW[i]=target;
    b.style.width = dockW[i].toFixed(2)+'px';
    b.style.height = (dockW[i]*1.25).toFixed(2)+'px';
  });
  placeTip();
}

/* ---------- switching ---------- */
let cur = -1, busy = false, queued = null;
function idxFromHash(){
  const id = location.hash.slice(1);
  const i = P.findIndex(p=>p.id===id || p.name.replace(/ /g,'-')===id);
  return i<0 ? 0 : i;
}
function preload(url){
  return new Promise(res=>{ const im = new Image(); im.onload = im.onerror = res; im.src = url; setTimeout(res,500) });
}
function loadVideo(p){
  vid.poster = src(p,'.jpg');
  vid.src = src(p,'.mp4');
  vid.muted = !soundOn;
  const pr = vid.play(); if(pr) pr.catch(()=>{ vid.muted = true; vid.play().catch(()=>{}) });
}

async function go(i, opts={}){
  i = (i + P.length) % P.length;
  if(i===cur && !opts.force) return;
  if(busy){ queued = i; return; }
  busy = true;
  const dir = opts.dir ?? (cur<0 ? 1 : (i>cur ? 1 : -1));
  const p = P[i], first = cur<0;
  cur = i;
  history.replaceState(null,'','#'+p.id);
  document.title = `${p.name} · sekenov`;
  thumbs.forEach((b,k)=>b.classList.toggle('on',k===i));
  centerThumb(i, first);
  setOdo(i+1);
  stage.classList.remove('is-paused'); userPaused = false;

  if(first || reduced){
    splitTitle(p.name); descEl.textContent = p.desc;
    metaEl.innerHTML = p.tags.map(t=>`<span class="tag">${t}</span>`).join('') + `<span class="tag" id="loopTag">loop</span>`;
    loadVideo(p);
    if(first && !reduced) intro();
    busy = false; return;
  }

  rollTitle(p.name, dir);
  setInfo(p, dir);
  const posterReady = preload(src(p,'.jpg'));

  // 1. the screen squashes into a thread
  thread.style.opacity = 0;
  const shut = screen.animate(
    [{clipPath:'inset(0% 0% 0% 0% round 16px)'},{clipPath:'inset(49.6% 0% 49.6% 0% round 2px)'}],
    {duration:260,easing:'cubic-bezier(.7,0,.84,0)',fill:'forwards'});
  thread.animate([{opacity:0},{opacity:0,offset:.6},{opacity:1}],{duration:260,fill:'forwards'});
  await shut.finished;

  // 2. the thread gets plucked in the direction you went
  loadVideo(p);
  await Promise.all([
    posterReady,
    thread.animate([
      {transform:'translateX(0) scaleX(1) scaleY(1)'},
      {transform:`translateX(${dir*18}px) scaleX(.94) scaleY(2.2)`,offset:.35},
      {transform:`translateX(${-dir*6}px) scaleX(1.01) scaleY(1)`,offset:.7},
      {transform:'translateX(0) scaleX(1) scaleY(1)'}
    ],{duration:300,easing:'ease-out'}).finished
  ]);

  // 3. the new piece grows out of the same thread
  thread.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  const open = screen.animate(
    [{clipPath:'inset(49.6% 0% 49.6% 0% round 2px)'},{clipPath:'inset(0% 0% 0% 0% round 16px)'}],
    {duration:520,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
  await open.finished;
  open.commitStyles?.(); open.cancel(); shut.cancel();

  busy = false;
  if(queued!==null){ const q = queued; queued = null; go(q); }
}

function centerThumb(i, instant){
  const b = thumbs[i];
  const left = b.offsetLeft - reel.clientWidth/2 + b.offsetWidth/2;
  reel.scrollTo({left, behavior: instant||reduced ? 'auto' : 'smooth'});
}

function intro(){
  screen.animate([{clipPath:'inset(49.6% 0% 49.6% 0% round 2px)'},{clipPath:'inset(0% 0% 0% 0% round 16px)'}],
    {duration:900,delay:250,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});
  thread.animate([{opacity:0,transform:'scaleX(0)'},{opacity:1,transform:'scaleX(1)',offset:.25},{opacity:1,offset:.3},{opacity:0}],
    {duration:1000,easing:'cubic-bezier(.2,.8,.2,1)'});
  titleEl.querySelectorAll('.ch').forEach((s,i)=>s.animate(
    [{transform:'translateY(105%)'},{transform:'translateY(0)'}],
    {duration:700,delay:400+i*30,easing:'cubic-bezier(.2,1.25,.3,1)',fill:'backwards'}));
  [descEl,metaEl,document.querySelector('.nav'),document.querySelector('.count')].forEach((el,i)=>el.animate(
    [{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],
    {duration:600,delay:550+i*90,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
  thumbs.forEach((b,i)=>b.animate([{opacity:0,transform:'translateY(14px)'},{transform:'none'}],
    {duration:500,delay:500+i*18,easing:'cubic-bezier(.2,1.2,.3,1)',fill:'backwards'}));
}

/* ---------- progress + loop length from the real file ---------- */
const prog = $('#prog');
vid.addEventListener('loadedmetadata',()=>{
  const t = document.getElementById('loopTag');
  if(t && isFinite(vid.duration)) t.textContent = vid.duration.toFixed(1)+' s loop';
});
function tick(){
  if(vid.duration) prog.style.transform = `scaleX(${vid.currentTime/vid.duration})`;
  dock();
  requestAnimationFrame(tick);
}

/* ---------- controls ---------- */
$('#prev').onclick = ()=>go(cur-1,{dir:-1});
$('#next').onclick = ()=>go(cur+1,{dir:1});
$('#home').onclick = e=>{ e.preventDefault(); go(0,{dir:-1}) };

let userPaused = false;
function togglePause(){
  userPaused = !vid.paused ? true : false;
  if(userPaused){ vid.pause(); stage.classList.add('is-paused') }
  else { vid.play().catch(()=>{}); stage.classList.remove('is-paused') }
}
// browsers pause muted video in background tabs and power saving; pick it back up
setInterval(()=>{
  if(vid.paused && !userPaused && !document.hidden && !$('#index').classList.contains('open')) vid.play().catch(()=>{});
},1000);

let soundOn = false;
function setSound(on){
  soundOn = on; vid.muted = !on;
  if(on && vid.paused) vid.play().catch(()=>{});
  $('#sound').classList.toggle('sound-on',on);
  $('#sound').setAttribute('aria-pressed',on);
}
$('#sound').onclick = ()=>setSound(!soundOn);

function switchTheme(e){
  const next = theme()==='dark' ? 'light' : 'dark';
  const t = vid.currentTime, playing = !vid.paused;
  const apply = ()=>{
    setTheme(next); store.set('theme',next); paintThumbs(); paintGrid();
    const p = P[cur];
    vid.poster = src(p,'.jpg'); vid.src = src(p,'.mp4');
    vid.addEventListener('loadedmetadata',()=>{ vid.currentTime = t; if(playing) vid.play().catch(()=>{}) },{once:true});
  };
  if(!document.startViewTransition || reduced) return apply();
  const r = $('#theme').getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  const R = Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>{
    document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},
      {duration:650,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'});
  });
}
$('#theme').onclick = switchTheme;

/* swipe and drag on the stage */
let sx=null, sy=null, dx=0;
stage.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; dx=0; stage.setPointerCapture(e.pointerId) });
stage.addEventListener('pointermove',e=>{
  if(sx===null||busy) return;
  dx = e.clientX - sx;
  if(Math.abs(dx) > Math.abs(e.clientY - sy)) screen.style.transform = `translateX(${dx*.25}px) rotate(${dx*.008}deg)`;
});
stage.addEventListener('pointerup',e=>{
  if(sx===null) return;
  const moved = Math.abs(dx);
  screen.animate([{transform:screen.style.transform||'none'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,1.4,.3,1)'});
  screen.style.transform = '';
  if(moved>50) go(cur + (dx<0?1:-1),{dir:dx<0?1:-1});
  else if(moved<6) togglePause();
  sx = null;
});
stage.addEventListener('pointercancel',()=>{ sx=null; screen.style.transform='' });

/* horizontal trackpad swipe */
let wheelLock = 0;
stage.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX) < Math.abs(e.deltaY) || Math.abs(e.deltaX) < 25) return;
  e.preventDefault();
  const now = performance.now(); if(now < wheelLock) return;
  wheelLock = now + 700;
  go(cur + (e.deltaX>0?1:-1),{dir:e.deltaX>0?1:-1});
},{passive:false});

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==='Escape'){ closeIndex(); closeContact(); return; }
  if($('#index').classList.contains('open')) return;
  if(k==='ArrowRight'||k==='j'){ go(cur+1,{dir:1}); }
  else if(k==='ArrowLeft'||k==='k'){ go(cur-1,{dir:-1}); }
  else if(k===' '){ e.preventDefault(); togglePause(); }
  else if(k==='m'){ setSound(!soundOn); }
  else if(k==='t'){ switchTheme(); }
  else if(k==='g'){ openIndex(); }
});
addEventListener('hashchange',()=>{ const i = idxFromHash(); if(i!==cur) go(i) });

/* ---------- index overlay ---------- */
const grid = $('#grid'), filtersEl = $('#filters');
const cards = P.map((p,i)=>{
  const b = document.createElement('button'); b.className='card';
  b.innerHTML = `<div class="pic"><img alt="" loading="lazy" decoding="async"></div><b>${p.name}</b><span>${p.desc}</span>`;
  b.onclick = ()=>{ closeIndex(); go(i); };
  // a short preview plays only while the pointer rests on the card
  let v=null, timer=null;
  b.onpointerenter = e=>{
    if(e.pointerType!=='mouse') return;
    timer = setTimeout(()=>{
      v = document.createElement('video'); v.muted=true; v.loop=true; v.playsInline=true; v.src=src(p,'.mp4');
      v.style.opacity=0; b.querySelector('.pic').appendChild(v);
      v.play().then(()=>v.animate([{opacity:0},{opacity:1}],{duration:200,fill:'forwards'})).catch(()=>{});
    },180);
  };
  b.onpointerleave = ()=>{ clearTimeout(timer); if(v){ v.remove(); v=null } };
  grid.appendChild(b); return b;
});
function paintGrid(){ cards.forEach((c,i)=>c.querySelector('img').src = src(P[i],'-t.jpg')) }

const tagCount = {};
P.forEach(p=>p.tags.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
const tags = ['everything',...Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a])];
let filter = 'everything';
tags.forEach(t=>{
  const b = document.createElement('button'); b.className='filter'+(t===filter?' on':'');
  b.innerHTML = `${t}<sup>${t==='everything'?P.length:tagCount[t]}</sup>`;
  b.onclick = ()=>{
    filter = t;
    filtersEl.querySelectorAll('.filter').forEach(f=>f.classList.toggle('on',f===b));
    let n=0;
    cards.forEach((c,i)=>{
      const show = t==='everything' || P[i].tags.includes(t);
      c.classList.toggle('hide',!show);
      if(show && !reduced) c.animate([{opacity:0,transform:'translateY(10px) scale(.98)'},{opacity:1,transform:'none'}],
        {duration:420,delay:(n++)*28,easing:'cubic-bezier(.2,1,.3,1)',fill:'backwards'});
    });
  };
  filtersEl.appendChild(b);
});

function openIndex(){
  const ix = $('#index'); ix.classList.add('open'); ix.scrollTop = 0;
  if(!reduced) cards.filter(c=>!c.classList.contains('hide')).forEach((c,n)=>c.animate(
    [{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],
    {duration:520,delay:60+n*24,easing:'cubic-bezier(.2,1,.3,1)',fill:'backwards'}));
  vid.pause();
}
function closeIndex(){
  const ix = $('#index'); if(!ix.classList.contains('open')) return;
  ix.classList.remove('open');
  if(!userPaused) vid.play().catch(()=>{});
}
$('#openIndex').onclick = openIndex;
$('#closeIndex').onclick = closeIndex;

/* ---------- contact: the green dot opens up into the card ---------- */
const contact = $('#contact'), scrim = $('#scrim');
const rows = [
  ME.x && {k:'x', v:'@'+ME.x, href:'https://x.com/'+ME.x, go:['dm','↗']},
  ME.threads && {k:'threads', v:'@'+ME.threads, href:'https://www.threads.com/@'+ME.threads, go:['dm','↗']},
  ME.email && {k:'email', v:ME.email, copy:ME.email, go:['copy','copied']},
].filter(Boolean);
$('#rows').innerHTML = rows.map((r,i)=>r.href
  ? `<a class="row" href="${r.href}" target="_blank" rel="noopener"><span class="k">${r.k}</span><span class="v">${r.v}</span><span class="go"><span>${r.go[0]}</span></span></a>`
  : `<button class="row" data-copy="${r.copy}"><span class="k">${r.k}</span><span class="v">${r.v}</span><span class="go"><span>${r.go[0]}</span><span>${r.go[1]}</span></span></button>`).join('');
contact.querySelectorAll('[data-copy]').forEach(b=>b.onclick = ()=>{
  const done = ()=>{ b.classList.add('done'); setTimeout(()=>b.classList.remove('done'),1600) };
  (navigator.clipboard?.writeText(b.dataset.copy) || Promise.reject()).then(done).catch(()=>{ location.href='mailto:'+b.dataset.copy });
});

function openContact(){
  const btn = $('#talk'), dot = btn.querySelector('.dot');
  const r = btn.getBoundingClientRect();
  contact.style.top = (r.bottom + 10) + 'px';
  contact.style.left = Math.max(16, r.right - 300) + 'px';
  contact.classList.add('open'); scrim.classList.add('on');
  const c = contact.getBoundingClientRect(), d = dot.getBoundingClientRect();
  const x = d.left + d.width/2 - c.left, y = d.top + d.height/2 - c.top;
  const R = Math.hypot(Math.max(x,c.width-x),Math.max(y,c.height-y));
  if(reduced) return;
  contact.animate({clipPath:[`circle(4px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},
    {duration:480,easing:'cubic-bezier(.2,.9,.2,1)'});
  contact.querySelectorAll('p,.row').forEach((el,i)=>el.animate(
    [{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],
    {duration:360,delay:120+i*50,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
}
function closeContact(){
  if(!contact.classList.contains('open')) return;
  scrim.classList.remove('on');
  if(reduced){ contact.classList.remove('open'); return; }
  contact.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-4px) scale(.98)'}],{duration:160})
    .finished.then(()=>contact.classList.remove('open'));
}
$('#talk').onclick = ()=> contact.classList.contains('open') ? closeContact() : openContact();
scrim.onclick = closeContact;

/* ---------- start ---------- */
$('#foot').textContent = `${P.length} pieces · every frame is code, recorded straight from the browser`;
paintThumbs(); paintGrid();
go(idxFromHash());
requestAnimationFrame(tick);
</script>
</body>
</html>
