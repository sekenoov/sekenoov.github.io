<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dias Sekenov</title>
<meta name="description" content="Dias Sekenov, product designer who codes. Small interface moments, built by hand.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#dcdce0" media="(prefers-color-scheme: light)">
<meta property="og:title" content="Dias Sekenov">
<meta property="og:description" content="product designer who codes. small interface moments, built by hand">
<meta property="og:image" content="https://sekenoov.github.io/og.jpg">
<meta property="og:url" content="https://sekenoov.github.io/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@sekenoov">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='14' height='20' rx='3.5' fill='%238e8e93'/%3E%3Crect x='12' y='4' width='17' height='24' rx='4' fill='%23000'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#dcdce0; --ink:#1c1c1e; --mute:#6e6e73; --hair:rgba(0,0,0,.1); --link:#007aff;
  --card-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --ink:#f2f2f7; --mute:#8e8e93; --hair:rgba(255,255,255,.1); --link:#0a84ff;
    --card-shadow:0 0 0 .5px rgba(255,255,255,.12),0 12px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* header: name on the left, how to reach out on the right */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px;pointer-events:none}
.bar>*{pointer-events:auto}
.who b{display:block;font-size:17px;font-weight:600;letter-spacing:-.022em}
.who span{color:var(--mute);font-size:15px;letter-spacing:-.01em}
.reach{text-align:right}
.reach .links{display:flex;gap:18px;justify-content:flex-end;font-size:17px;letter-spacing:-.022em}
.reach .links a,.reach .links button{color:var(--link);transition:opacity .1s}
.reach .links a:active,.reach .links button:active{opacity:.45}
.reach>span{color:var(--mute);font-size:15px;letter-spacing:-.01em}
.swap{display:inline-grid;height:1.4em;overflow:hidden;vertical-align:top;text-align:right}
.swap i{font-style:normal;grid-area:1/1;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s}
.swap i:last-child{transform:translateY(100%);opacity:0}
.copied .swap i:first-child{transform:translateY(-100%);opacity:0}
.copied .swap i:last-child{transform:none;opacity:1}

/* the switcher */
.sw{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.sw.dragging{cursor:grabbing}
.card{position:absolute;left:50%;top:0;will-change:transform;transform-origin:50% 50%}
.frame{position:absolute;inset:0;border-radius:20px;overflow:hidden;box-shadow:var(--card-shadow);background:#888;transform:translateZ(0)}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.frame video{opacity:0}
.frame video.live{opacity:1}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.label{position:absolute;left:2px;bottom:calc(100% + 10px);display:flex;align-items:center;gap:8px;transform-origin:0 100%;white-space:nowrap;pointer-events:none}
.label img{width:22px;height:22px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 .5px var(--hair)}
.label span{font-size:15px;font-weight:600;letter-spacing:-.015em;text-transform:capitalize}

/* what you see once a card is open */
.detail{position:fixed;left:50%;z-index:40;width:min(560px,calc(100vw - 32px));transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0}
.detail p{font-size:17px;letter-spacing:-.022em;line-height:1.35}
.detail p::first-letter{text-transform:uppercase}
.detail .row{margin-top:6px;color:var(--mute);font-size:15px;display:flex;gap:14px;justify-content:center}
.detail button{color:var(--link)}

/* position ruler, scrubbable */
.ruler{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:45;display:flex;align-items:flex-end;height:30px;padding:0 6px;touch-action:none;cursor:ew-resize}
.ruler i{display:block;width:9px;height:100%;position:relative}
.ruler i::after{content:"";position:absolute;left:4px;bottom:0;width:1.5px;border-radius:1px;background:var(--ink);height:var(--h,5px);opacity:var(--o,.25)}

@media (max-width:700px){
  .bar{padding:16px}
  .who b,.reach .links{font-size:16px}
  .who span,.reach>span{font-size:13px}
  .reach .links{gap:14px}
  .frame{border-radius:16px}
  .label span{font-size:14px}
  .label img{width:20px;height:20px;border-radius:5px}
  .ruler{bottom:max(22px,env(safe-area-inset-bottom))}
  .ruler i{width:8px}
  .ruler i::after{left:3.25px}
  .detail p{font-size:16px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="who"><b>Dias Sekenov</b><span>Product designer who codes</span></div>
  <div class="reach">
    <div class="links" id="links"></div>
    <span>Open for projects</span>
  </div>
</header>

<main class="sw" id="sw" aria-label="pieces"></main>

<div class="detail" id="detail" aria-live="polite">
  <p id="desc"></p>
  <div class="row"><span id="loop"></span><button id="sound">Sound on</button></div>
</div>

<nav class="ruler" id="ruler" aria-label="position"></nav>

<script>
const ME = { x:'sekenoov', threads:'sekenov.ai', email:'sekenoov@gmail.com' };

// folder, name, one line, where the poster frame sits (fraction of the loop)
const P = [
  ['online','online','messages circle the green dot like moths around a porch light',0.6],
  ['mute','good','a whole weekend story told on mute piles up in the call tile',0.2],
  ['watching','still watching','continue watching pulls the cursor away from back like a magnet',0.9],
  ['brunch','thank god','friends cancel brunch one by one and drop out of the group header',0.8],
  ['pick','you pick','lunch indecision as a ping-pong rally until the replies shrink to “u”',0.3],
  ['anyway','anyway','do not disturb bounces the boss, then “quick question” breaks it',0.4],
  ['hbd','hbd','every word you deleted piles up on the keyboard',0.5],
  ['fold','fold','each “are you sure?” folds the answer like a note',0.9],
  ['refresh','refresh','pull to refresh and “unfortunately,” drops in like every other email',0.3],
  ['nvm','nvm','a 7:48 voice note unrolls across the screen like tape',0.3],
  ['hey','hey','a 2 am “hey” pulls the whole lock screen in',0.8],
  ['unsend','unsend','five rubber bands hold the sent message, your finger is late to undo',0.3],
  ['source','source','the link in the answer is a 404 and the answer falls apart plank by plank',0.6],
  ['typing','typing','the typing bubble inflates like a balloon on “are you mad at me?”',0.8],
  ['monday','later','monday as a macos update you can’t postpone',0.3],
  ['sunday','charged','the phone charges all weekend, monday eats it by 9 am',0.8],
  ['alarms','no alarms','swipe the alarms away, one of them never turns off',0.9],
  ['shake','shake','shake the phone and the em dashes fall out of the answer',0.2],
  ['friday','weekend','at 5:00 pm a weekend block pushes the weekdays aside',0.7],
  ['brake','brake','stop a streaming answer and the words crash by inertia',0.9],
  ['cooldown','cooldown','hold send and an angry email cools down into corporate',0.5],
  ['almost','almost','the answer spins like a slot reel between no and yes',0.3],
  ['rabbit','rabbit hole','one word of the answer becomes the next question, forever',0.6],
  ['develop','develop','an image develops out of noise, word by word of the prompt',0.4],
  ['pinch','pinch','pinch an ai answer from 112 words down to 9',0.8],
  ['compact','compact','the chat compresses and the facts fly into a summary',0.2],
].map(([id,name,desc,at])=>({id,name,desc,at}));
const N = P.length;

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const lerp = (a,b,t) => a+(b-a)*t;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const dark = matchMedia('(prefers-color-scheme: dark)');
const theme = () => dark.matches ? 'dark' : 'light';
const src = (p,kind) => `media/${p.id}-${theme()}${kind}`;

/* ---------- springs: damping ratio + response, the UIKit way ---------- */
class Spring{
  constructor(x){ this.x=x; this.v=0; this.t=x; this.z=1; this.r=.4 }
  to(t,{v=this.v,z=1,r=.4}={}){ this.t=t; this.v=v; this.z=z; this.r=reduced?.08:r }
  set(x){ this.x=x; this.t=x; this.v=0 }
  step(dt){
    const k=(2*Math.PI/this.r)**2, c=4*Math.PI*this.z/this.r;
    const n=Math.max(1,Math.ceil(dt*240)), h=dt/n;
    for(let i=0;i<n;i++){ this.v += (-k*(this.x-this.t) - c*this.v)*h; this.x += this.v*h }
    if(Math.abs(this.x-this.t)<1e-4 && Math.abs(this.v)<1e-3){ this.x=this.t; this.v=0 }
  }
}
// Apple's projection from Designing Fluid Interfaces: where a flick would come to rest
const project = (v,d=.998) => (v/1000)*d/(1-d);
// soft edge: the further past the end, the less it follows
const rubber = (o,dim,c=.55) => (o*dim*c)/(dim+c*Math.abs(o));

const pos  = new Spring(0);   // continuous index of the front card
const open = new Spring(0);   // 0 switcher, 1 card opened
const lift = new Spring(0);   // vertical pull on the front card, px

/* ---------- build ---------- */
const sw = $('#sw'), ruler = $('#ruler');
const cards = P.map((p,i)=>{
  const el = document.createElement('div');
  el.className = 'card'; el.style.zIndex = i; el.dataset.i = i;
  el.setAttribute('aria-label', p.name);
  el.innerHTML = `<div class="label"><img alt=""><span>${p.name}</span></div>
    <div class="frame"><img alt="" decoding="async"><video muted loop playsinline preload="none"></video><div class="shade"></div></div>`;
  sw.appendChild(el);
  const c = { el, i, label:el.querySelector('.label'), ico:el.querySelector('.label img'),
    poster:el.querySelector('.frame img'), video:el.querySelector('video'), shade:el.querySelector('.shade'),
    shown:true, loaded:false };
  c.video.addEventListener('playing',()=>c.video.classList.add('live'));
  c.video.addEventListener('loadedmetadata',()=>{ if(front===i) showLoop() });
  return c;
});
const ticks = P.map(p=>{ const t=document.createElement('i'); t.title=p.name; ruler.appendChild(t); return t });

function paint(){
  cards.forEach((c,i)=>{
    c.ico.src = src(P[i],'-t.jpg');
    c.poster.src = src(P[i],'.jpg');
    if(c.loaded){
      const t = c.video.currentTime, playing = c.i===front;
      c.video.classList.remove('live');
      c.video.src = src(P[i],'.mp4');
      c.video.addEventListener('loadedmetadata',()=>{ c.video.currentTime=t; if(playing) c.video.play().catch(()=>{}) },{once:true});
    }
  });
}
dark.addEventListener('change', paint);

/* contacts */
$('#links').innerHTML =
  `<a href="https://x.com/${ME.x}" target="_blank" rel="noopener">X</a>`+
  `<a href="https://www.threads.com/@${ME.threads}" target="_blank" rel="noopener">Threads</a>`+
  `<button id="mail" title="${ME.email}"><span class="swap"><i>Email</i><i>Copied</i></span></button>`;
$('#mail').onclick = e=>{
  const b = e.currentTarget;
  if(!navigator.clipboard){ location.href='mailto:'+ME.email; return }
  navigator.clipboard.writeText(ME.email).then(()=>{
    b.classList.add('copied'); clearTimeout(b._t); b._t = setTimeout(()=>b.classList.remove('copied'),1800);
  }).catch(()=>{ location.href='mailto:'+ME.email });
};

/* ---------- geometry ---------- */
let W,H,S,VW,VH,CY,OPEN,OPEN_Y,mobile;
function layout(){
  VW = innerWidth; VH = innerHeight; mobile = VW < 700;
  const top = mobile ? 92 : 96, bottom = mobile ? 74 : 80;
  W = mobile ? Math.min(VW*.8,(VH-top-bottom-60)*.8) : Math.min(VW*.3,(VH-top-bottom-60)*.8,440);
  H = W*1.25; S = W*1.06;
  CY = top + (VH-top-bottom)/2 + 14;
  // opened card: as large as fits, with room for one line of text under it
  const room = VH - top - bottom - 96;
  OPEN = Math.max(1.05, Math.min(room/H, (VW-32)/W, 1.9));
  OPEN_Y = top + 30 + H*OPEN/2 - CY;
  cards.forEach(c=>{ c.el.style.width=W+'px'; c.el.style.height=H+'px'; c.el.style.marginLeft=-W/2+'px'; c.el.style.top=(CY-H/2)+'px' });
  $('#detail').style.top = (CY + OPEN_Y + H*OPEN/2 + 18)+'px';
}
addEventListener('resize', layout);

/* ---------- render: everything comes from the three springs ---------- */
let front = -1;
const det = $('#detail');
function render(){
  const p = pos.x, o = clamp(open.x,0,1.2), oc = clamp(o,0,1), f = clamp(Math.round(p),0,N-1);
  for(const c of cards){
    const d = c.i - p;
    const visible = d > -7 && d < 2.6;
    if(visible !== c.shown){ c.el.style.visibility = visible ? '' : 'hidden'; c.shown = visible }
    if(!visible) continue;

    // right of the front card: full spacing, sliding over the top
    // left of it: piling up underneath, smaller and darker
    let x, s, dim;
    if(d >= 0){ x = d*S; s = 1; dim = 0 }
    else { x = -0.7*W*(1-Math.exp(.55*d)); s = 1 + .045*Math.max(d,-4); dim = Math.min(.55,-d*.2) }

    let y = 0, op = 1;
    if(c.i === f){
      x = lerp(x,0,o); s = lerp(s,OPEN,o); y = lerp(0,OPEN_Y,o) + lift.x; dim = lerp(dim,0,oc);
      if(oc < .01) s *= 1 - Math.min(.05, Math.abs(lift.x)/H*.2);
    } else {
      op = 1 - oc; s *= 1 - .06*oc; y = 30*oc;
    }
    c.el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) scale(${s.toFixed(4)})`;
    c.el.style.opacity = op;
    c.shade.style.opacity = dim;
    // labels of buried cards fade before they collide
    c.label.style.opacity = d < 0 ? clamp(1 + d*1.25, 0, 1) : 1;
    c.label.style.transform = `scale(${(1/s).toFixed(4)})`;
  }
  ticks.forEach((t,i)=>{
    const g = Math.exp(-((i-p)**2)/.9);
    t.style.setProperty('--h', (5 + 13*g).toFixed(2)+'px');
    t.style.setProperty('--o', (.22 + .78*g).toFixed(3));
  });
  det.style.opacity = clamp((o-.4)/.6,0,1);
  det.style.transform = `translateX(-50%) translateY(${((1-oc)*10).toFixed(2)}px)`;
  det.style.pointerEvents = o > .9 ? 'auto' : 'none';
  if(f !== front) setFront(f);
  if(playing !== front && Math.abs(pos.v) < 2.5 && !g) play(front);
}

/* ---------- media: only the front card plays ---------- */
let soundOn = true;
function showLoop(){ const v = cards[front].video; $('#loop').textContent = isFinite(v.duration) ? v.duration.toFixed(1)+' s loop' : '' }
let playing = -1;
function setFront(f){
  const prev = cards[playing];
  if(prev && playing !== f){ prev.video.pause(); prev.video.muted = true }
  playing = -1;
  front = f;
  $('#desc').textContent = P[f].desc;
  showLoop();
  history.replaceState(null,'','#'+P[f].id);
  document.title = `${P[f].name} · Dias Sekenov`;
}
// the video starts once the deck slows down, not for every card that flies past
function play(f){
  const c = cards[f], p = P[f];
  playing = f;
  if(!c.loaded){
    c.loaded = true;
    c.video.src = src(p,'.mp4');
    // start where the poster frame was taken, so the switch to video is invisible
    c.video.addEventListener('loadedmetadata',()=>{ c.video.currentTime = p.at < 1 ? c.video.duration*p.at : p.at },{once:true});
  }
  c.video.muted = !(open.t > .5 && soundOn);
  c.video.play().catch(()=>{});
}
// browsers pause muted video in the background or in low power mode; pick it back up
setInterval(()=>{ const v = cards[playing]?.video; if(v && v.paused && !document.hidden) v.play().catch(()=>{}) },1200);

function setOpen(on, v=0){
  open.to(on?1:0,{v, z: on ? .86 : 1, r: on ? .42 : .36});
  if(on && playing !== front) play(front);
  const vid = cards[front].video;
  vid.muted = !(on && soundOn);
  if(on && vid.paused) vid.play().catch(()=>{});
  $('#sound').textContent = soundOn ? 'Sound on' : 'Sound off';
}
function toggleSound(){
  soundOn = !soundOn;
  cards[front].video.muted = !(soundOn && open.t > .5);
  $('#sound').textContent = soundOn ? 'Sound on' : 'Sound off';
}
$('#sound').onclick = toggleSound;

function goTo(i,opts={}){ pos.to(clamp(i,0,N-1),{v:pos.v, z:1, r:.42, ...opts}) }

/* ---------- direct manipulation ---------- */
let g = null;
function idxOf(el){ const c = el && el.closest && el.closest('.card'); return c ? +c.dataset.i : -1 }
sw.addEventListener('pointerdown',e=>{
  if(e.button) return;
  const hit = idxOf(e.target);
  sw.setPointerCapture(e.pointerId);
  g = { x0:e.clientX, y0:e.clientY, p0:pos.x, o0:open.x, axis:null, hit, hist:[[e.clientX,e.clientY,e.timeStamp]] };
  // catch whatever is moving, exactly where it is on screen
  pos.set(pos.x); lift.set(lift.x); open.set(open.x);
  sw.classList.add('dragging');
});
sw.addEventListener('pointermove',e=>{
  if(!g) return;
  const dx = e.clientX-g.x0, dy = e.clientY-g.y0;
  g.hist.push([e.clientX,e.clientY,e.timeStamp]);
  while(g.hist.length>2 && e.timeStamp-g.hist[0][2] > 100) g.hist.shift();
  if(!g.axis){
    if(Math.hypot(dx,dy) < 8) return;
    g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if(g.axis==='x' && g.o0 > .5) g.axis = 'none';
  }
  if(g.axis==='x'){
    const raw = g.p0 - dx/S;
    pos.set(raw < 0 ? -rubber(-raw,1) : raw > N-1 ? N-1 + rubber(raw-N+1,1) : raw);
  } else if(g.axis==='y'){
    if(g.o0 > .5){
      // opened: pull it down to put it back
      open.set(clamp(g.o0 - Math.max(0,dy)/(VH*.55), 0, 1));
      lift.set(dy < 0 ? -rubber(-dy,H,.3) : dy*.35);
    } else {
      // in the deck: it follows, then resists
      lift.set(rubber(dy,H,.5));
    }
  }
});
function release(e){
  if(!g) return;
  sw.classList.remove('dragging');
  const h = g.hist, a = h[0], b = h[h.length-1], dt = Math.max(16,(b[2]-a[2]))/1000;
  const vx = (b[0]-a[0])/dt, vy = (b[1]-a[1])/dt;
  const dy = e.clientY - g.y0;

  if(!g.axis){
    // a tap
    if(open.x > .5){ if(g.hit === front) toggleSound(); else setOpen(false) }
    else if(g.hit === front) setOpen(true);
    else if(g.hit >= 0) goTo(g.hit);
  } else if(g.axis==='x'){
    // the spring takes over at the finger's speed and lands where the flick was heading
    const target = clamp(Math.round(pos.x + project(-vx)/S), 0, N-1);
    pos.to(target,{v:-vx/S, z: Math.abs(vx) > 400 ? .86 : 1, r:.45});
  } else if(g.axis==='y'){
    if(g.o0 > .5){
      // direction of the release decides, not only distance
      const close = vy > 200 || (vy > -200 && dy > 90);
      lift.to(0,{v:vy, z:.9, r:.4});
      setOpen(!close, -vy/(VH*.55));
    } else {
      lift.to(0,{v:vy, z:.7, r:.42});
    }
  } else {
    lift.to(0);
  }
  g = null;
}
sw.addEventListener('pointerup',release);
sw.addEventListener('pointercancel',release);

/* trackpad and wheel move the deck directly, then it settles in the direction of travel */
let wheelRaw = null, wheelT = 0, wheelV = 0, wheelLast = 0;
sw.addEventListener('wheel',e=>{
  e.preventDefault();
  if(open.t > .5){ if(Math.abs(e.deltaY) > 20) setOpen(false); return }
  let d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(e.deltaMode === 1) d *= 18;
  if(wheelRaw === null) wheelRaw = pos.x;
  wheelRaw = clamp(wheelRaw + d/S, -1, N);
  pos.set(wheelRaw < 0 ? -rubber(-wheelRaw,1) : wheelRaw > N-1 ? N-1 + rubber(wheelRaw-N+1,1) : wheelRaw);
  const now = e.timeStamp, dt = Math.max(8, now-wheelLast)/1000;
  wheelV = .7*wheelV + .3*(d/S)/dt; wheelLast = now;
  clearTimeout(wheelT);
  wheelT = setTimeout(()=>{
    const t = wheelV > 0 ? Math.ceil(pos.x - .15) : Math.floor(pos.x + .15);
    pos.to(clamp(t,0,N-1),{v:0, z:1, r:.4});
    wheelRaw = null; wheelV = 0;
  },110);
},{passive:false});

/* ruler: scrub through everything */
let scrub = false;
function scrubTo(e){
  const r = ruler.getBoundingClientRect();
  const i = clamp(Math.floor((e.clientX - r.left - 6)/((r.width-12)/N)), 0, N-1);
  pos.to(i,{v:pos.v, z:1, r:.28});
}
ruler.addEventListener('pointerdown',e=>{ scrub = true; ruler.setPointerCapture(e.pointerId); if(open.t>.5) setOpen(false); scrubTo(e) });
ruler.addEventListener('pointermove',e=>{ if(scrub) scrubTo(e) });
ruler.addEventListener('pointerup',()=>{ scrub = false });

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==='ArrowRight'){ if(open.t>.5) setOpen(false); goTo(Math.round(pos.t)+1) }
  else if(k==='ArrowLeft'){ if(open.t>.5) setOpen(false); goTo(Math.round(pos.t)-1) }
  else if(k==='Enter'||k===' '){ e.preventDefault(); setOpen(open.t < .5) }
  else if(k==='Escape'){ setOpen(false) }
  else if(k==='Home'){ goTo(0) }
  else if(k==='End'){ goTo(N-1) }
});
addEventListener('hashchange',()=>{ const i = P.findIndex(p=>'#'+p.id===location.hash); if(i>=0 && i!==Math.round(pos.t)) goTo(i) });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1/30,(now-last)/1000); last = now;
  pos.step(dt); open.step(dt); lift.step(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- start: the deck slides in from the right ---------- */
const start = Math.max(0, P.findIndex(p=>'#'+p.id===location.hash));
layout(); paint();
if(reduced) pos.set(start); else { pos.set(start-2.4); pos.to(start,{z:1,r:.9}) }
requestAnimationFrame(frame);
</script>
</body>
</html>
